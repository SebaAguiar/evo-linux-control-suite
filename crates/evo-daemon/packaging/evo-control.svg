<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26282e"/>
      <stop offset="70%" stop-color="#18191d"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </radialGradient>
    <radialGradient id="innerKnob" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2a2c33"/>
      <stop offset="75%" stop-color="#1a1b1f"/>
      <stop offset="100%" stop-color="#121316"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#32353d" stroke-width="6"/>

  <!-- Dial Outer Ring Track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#16171a" stroke-width="28"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#25272e" stroke-width="2"/>

  <!-- Halo LED Dots around the dial -->
  <!-- 24 dots at r=180 -->
  <!-- Active / illuminated dots in green #00ea76 -->
  <g fill="#00ea76" filter="url(#glow)">
    <circle cx="128.7" cy="329.5" r="7"/>
    <circle cx="103.5" cy="293.2" r="7"/>
    <circle cx="89.1" cy="256.0" r="7"/>
    <circle cx="89.1" cy="217.4" r="7"/>
    <circle cx="103.5" cy="180.2" r="7"/>
    <circle cx="128.7" cy="143.9" r="7"/>
    <circle cx="163.6" cy="115.5" r="7"/>
    <circle cx="204.7" cy="98.0" r="7"/>
    <circle cx="248.8" cy="92.1" r="7"/>
    <circle cx="292.8" cy="98.0" r="7"/>
    <circle cx="334.0" cy="115.5" r="7"/>
    <circle cx="368.9" cy="143.9" r="7"/>
    <circle cx="394.0" cy="180.2" r="7"/>
    <circle cx="408.5" cy="217.4" r="7"/>
    <circle cx="408.5" cy="256.0" r="7"/>
  </g>
  <!-- Inactive / dimmed dots -->
  <g fill="#333740">
    <circle cx="394.0" cy="293.2" r="5.5"/>
    <circle cx="368.9" cy="329.5" r="5.5"/>
    <circle cx="334.0" cy="357.9" r="5.5"/>
    <circle cx="292.8" cy="375.4" r="5.5"/>
    <circle cx="248.8" cy="381.3" r="5.5"/>
    <circle cx="204.7" cy="375.4" r="5.5"/>
    <circle cx="163.6" cy="357.9" r="5.5"/>
  </g>

  <!-- Central Rotary Knob Body -->
  <circle cx="256" cy="256" r="145" fill="url(#innerKnob)" stroke="#2b2d35" stroke-width="4"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- Audient EVO Infinity Logo -->
  <g transform="translate(148, 176) scale(6.75)" fill="#ffffff">
    <!-- Infinity symbol -->
    <path d="M22 8c-3.1 0-5.3 2.1-6 3.1-.7-1-2.9-3.1-6-3.1C5.6 8 2 11.6 2 16s3.6 8 8 8c3.1 0 5.3-2.1 6-3.1.7 1 2.9 3.1 6 3.1 4.4 0 8-3.6 8-8s-3.6-8-8-8zm-12 12c-2.2 0-4-1.8-4-4s1.8-4 4-4c2.4 0 4.1 2.5 5.2 4-1.1 1.5-2.8 4-5.2 4zm12 0c-2.4 0-4.1-2.5-5.2-4 1.1-1.5 2.8-4 5.2-4 2.2 0 4 1.8 4 4s-1.8 4-4 4z"/>
  </g>
</svg>
