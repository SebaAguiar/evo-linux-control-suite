name: Build Suite

# ==============================================================================
# GitHub Actions CI: Verificación, compilación y empaquetado para Linux x86_64.
# Se ejecuta automáticamente en push y pull_request a `main` y `dev`,
# y puede ejecutarse bajo demanda con parámetros personalizados en `workflow_dispatch`.
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      build_daemon:
        description: 'Compilar evo-daemon'
        required: false
        type: boolean
        default: true
      build_desktop:
        description: 'Compilar aplicación desktop (Tauri v2)'
        required: false
        type: boolean
        default: true
      create_deb:
        description: 'Empaquetar paquete instalable .deb (Desktop)'
        required: false
        type: boolean
        default: false

  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Verificación de código y Tests del Workspace Rust
  # ----------------------------------------------------------------------------
  check-and-test:
    name: Check & Tests (Rust Workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (ALSA, udev, SSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libssl-dev

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "evo-suite"

      - name: Verificar compilación del workspace
        run: cargo check --workspace --exclude evo-desktop

      - name: Ejecutar tests unitarios e integración
        run: cargo test --workspace --exclude evo-desktop

  # ----------------------------------------------------------------------------
  # Job 2: Compilación y empaquetado del Daemon
  # ----------------------------------------------------------------------------
  build-daemon:
    name: Build Daemon (Linux x86_64)
    needs: check-and-test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_daemon }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libssl-dev

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "evo-suite"

      - name: Compilar evo-daemon en modo release
        run: cargo build --release -p evo-daemon

      - name: Preparar paquete comprimido del Daemon
        run: |
          mkdir -p dist/daemon
          cp target/release/evo-daemon dist/daemon/
          cp -r crates/evo-daemon/packaging dist/daemon/
          cp scripts/evo dist/daemon/
          cp scripts/install.sh dist/daemon/
          chmod +x dist/daemon/evo-daemon dist/daemon/evo dist/daemon/install.sh
          tar -czvf evo-daemon-linux-x86_64.tar.gz -C dist/daemon .

      - name: Subir artefacto del Daemon
        uses: actions/upload-artifact@v7
        with:
          name: evo-daemon-linux-x86_64
          path: evo-daemon-linux-x86_64.tar.gz
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: Compilación y empaquetado de la App Desktop (React + Tauri v2)
  # ----------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (Linux x86_64)
    needs: check-and-test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_desktop }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (WebKitGTK, GLib, librsvg, ALSA, layer-shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "evo-suite"

      - name: Instalar dependencias del frontend
        working-directory: apps/desktop
        run: bun install --frozen-lockfile || bun install

      - name: Compilar frontend React (dist)
        working-directory: apps/desktop
        run: bun run build

      - name: Compilar binario de escritorio (sin empaquetar)
        if: ${{ !inputs.create_deb && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        run: bun run tauri build --no-bundle --ignore-version-mismatches

      - name: Compilar y empaquetar (.deb + AppImage firmados)
        if: ${{ inputs.create_deb || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles deb,appimage --ignore-version-mismatches

      - name: Preparar artefacto binario
        run: |
          mkdir -p dist/desktop
          cp target/release/evo-desktop dist/desktop/
          chmod +x dist/desktop/evo-desktop
          tar -czvf evo-desktop-linux-x86_64.tar.gz -C dist/desktop .

      - name: Subir artefacto binario standalone
        uses: actions/upload-artifact@v7
        with:
          name: evo-desktop-linux-x86_64
          path: evo-desktop-linux-x86_64.tar.gz
          retention-days: 14

      - name: Subir paquete instalable .deb y firmas
        if: ${{ inputs.create_deb || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: evo-desktop-deb
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
          retention-days: 14

      - name: Subir AppImage, su payload firmado y firmas
        if: ${{ inputs.create_deb || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: evo-desktop-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 4: Publicar Release en GitHub (cuando se pushea un tag v*)
  # ----------------------------------------------------------------------------
  publish-release:
    name: Publish Release & Updater Manifest
    needs: [build-daemon, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar directorio de release
        run: mkdir -p release-assets

      - name: Descargar artefactos del Daemon
        uses: actions/download-artifact@v4
        with:
          name: evo-daemon-linux-x86_64
          path: release-assets/tmp-daemon/

      - name: Descargar artefactos de Desktop (binario)
        uses: actions/download-artifact@v4
        with:
          name: evo-desktop-linux-x86_64
          path: release-assets/tmp-desktop/

      - name: Descargar artefactos de Desktop (.deb)
        uses: actions/download-artifact@v4
        with:
          name: evo-desktop-deb
          path: release-assets/

      - name: Descargar artefactos de Desktop (AppImage)
        uses: actions/download-artifact@v4
        with:
          name: evo-desktop-appimage
          path: release-assets/

      - name: Empaquetar EVO Suite autónomo y bootstrap
        run: |
          tar -xzf release-assets/tmp-daemon/evo-daemon-linux-x86_64.tar.gz -C release-assets/tmp-daemon/
          tar -xzf release-assets/tmp-desktop/evo-desktop-linux-x86_64.tar.gz -C release-assets/tmp-desktop/
          chmod +x scripts/package-suite.sh scripts/install-bootstrap.sh scripts/install.sh scripts/evo
          EVO_DAEMON_BIN="release-assets/tmp-daemon/evo-daemon" \
          EVO_DESKTOP_BIN="release-assets/tmp-desktop/evo-desktop" \
          ./scripts/package-suite.sh release-assets
          cp release-assets/tmp-daemon/evo-daemon-linux-x86_64.tar.gz release-assets/
          rm -rf release-assets/tmp-daemon release-assets/tmp-desktop release-assets/stage

      - name: Generar latest.json para el auto-updater
        env:
          ARTIFACTS_DIR: release-assets
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NOTES_FILE: CHANGELOG.md
        run: node .github/scripts/generate-latest-json.mjs

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
